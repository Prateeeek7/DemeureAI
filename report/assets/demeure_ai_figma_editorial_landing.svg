<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap');
      .heading { font-family: 'Outfit', 'Georgia', serif; font-weight: 700; fill: #111827; }
      .body-text { font-family: 'Inter', sans-serif; font-weight: 400; fill: #4B5563; }
      .body-bold { font-family: 'Inter', sans-serif; font-weight: 600; fill: #111827; }
      .mono { font-family: 'Courier New', Courier, monospace; fill: #1E3A5F; }
      .grid-lines { stroke: rgba(30, 58, 95, 0.03); stroke-width: 1; }
      .grid-lines-accent { stroke: rgba(30, 58, 95, 0.05); stroke-width: 0.5; }
      .border-line { stroke: rgba(17, 24, 39, 0.1); stroke-width: 1; }
    </style>
    
    <pattern id="blueprint-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" class="grid-lines" />
    </pattern>
    <pattern id="blueprint-grid-accent" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" class="grid-lines-accent" />
    </pattern>
  </defs>

  <!-- Canvas background and blueprint overlays -->
  <rect width="1920" height="1080" fill="#F8F6F2" />
  <rect width="1920" height="1080" fill="url(#blueprint-grid)" />
  <rect width="1920" height="1080" fill="url(#blueprint-grid-accent)" />

  <!-- 1. EDITORIAL HEADER -->
  <g id="Editorial-Header">
    <rect x="0" y="0" width="1920" height="80" fill="#FFFFFF" />
    <line x1="0" y1="80" x2="1920" y2="80" class="border-line" />
    
    <text x="32" y="38" class="mono" font-size="9" fill="#4B5563">Institutional Digital Protocol</text>
    <text x="32" y="58" class="heading" font-size="24" fill="#1E3A5F">DEMEURE AI</text>
    
    <text x="1300" y="46" class="mono" font-size="11" fill="#4B5563">LATITUDE: 28.6139° N  |  LONGITUDE: 77.2090° E</text>
    
    <g transform="translate(1660, 22)">
      <rect width="228" height="36" fill="#1E3A5F" />
      <text x="114" y="22" class="mono" font-size="10" fill="#FFFFFF" font-weight="bold" text-anchor="middle">ACCESS CORE COMMAND →</text>
    </g>
  </g>

  <!-- 2. HERO SECTION -->
  <g transform="translate(32, 112)">
    <!-- Left Hero Column -->
    <g transform="translate(0, 0)">
      <rect width="150" height="24" fill="#FFFFFF" stroke="#1E3A5F" />
      <text x="75" y="16" class="mono" font-size="9" fill="#1E3A5F" text-anchor="middle">Project Specification v1.0.4</text>
      
      <text x="0" y="80" class="heading" font-size="54" line-height="1.1">The Intelligent</text>
      <text x="0" y="140" class="heading" font-size="54" line-height="1.1">Campus Living</text>
      <text x="0" y="200" class="heading" font-size="54" line-height="1.1">Framework.</text>
      
      <text x="0" y="260" class="body-text" font-size="15" fill="#4B5563">Demeure AI re-architects university accommodation into a self-optimizing</text>
      <text x="0" y="285" class="body-text" font-size="15" fill="#4B5563">ecosystem. A unified institutional operating system uniting predictive</text>
      <text x="0" y="310" class="body-text" font-size="15" fill="#4B5563">maintenance, machine learning-driven resource management, and high-fidelity</text>
      <text x="0" y="335" class="body-text" font-size="15" fill="#4B5563">security diagnostics.</text>
      
      <!-- Command button -->
      <g transform="translate(0, 380)">
        <rect width="400" height="52" fill="#111827" />
        <text x="200" y="31" class="mono" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle">INITIALIZE OPERATIONS COMMAND →</text>
      </g>
    </g>
    
    <!-- Right Blueprint Masterplan Container (aspect ratio 2044 x 1446 mock) -->
    <g transform="translate(900, 0)">
      <rect width="956" height="460" fill="#FFFFFF" stroke="rgba(17, 24, 39, 0.1)" />
      
      <!-- Mock Blueprint outline of campus map -->
      <g transform="translate(24, 24)">
        <rect width="908" height="380" fill="#F8F6F2" stroke="rgba(17, 24, 39, 0.05)" />
        <line x1="0" y1="190" x2="908" y2="190" stroke="rgba(30,58,95,0.05)" stroke-dasharray="2 2" />
        <line x1="454" y1="0" x2="454" y2="380" stroke="rgba(30,58,95,0.05)" stroke-dasharray="2 2" />
        
        <!-- Stylized blueprint paths representing campus zones -->
        <rect x="80" y="60" width="220" height="120" fill="none" stroke="#1E3A5F" stroke-width="1" />
        <text x="190" y="125" class="mono" font-size="11" font-weight="bold" fill="#1E3A5F" text-anchor="middle">BLOCK A (NORTH WING)</text>
        
        <rect x="580" y="60" width="220" height="120" fill="none" stroke="#1E3A5F" stroke-width="1" />
        <text x="690" y="125" class="mono" font-size="11" font-weight="bold" fill="#1E3A5F" text-anchor="middle">BLOCK B (SOUTH WING)</text>
        
        <rect x="330" y="220" width="220" height="120" fill="none" stroke="#1E3A5F" stroke-width="1" />
        <text x="440" y="285" class="mono" font-size="11" font-weight="bold" fill="#1E3A5F" text-anchor="middle">CENTRAL MESS HALL</text>

        <!-- Coordinate crosshairs mock -->
        <circle cx="190" cy="120" r="4" fill="#1E3A5F" />
        <text x="200" y="116" class="mono" font-size="8" fill="#1E3A5F">28.6131° N / 77.2045° E</text>
      </g>
      
      <!-- Stamp tag -->
      <rect x="800" y="0" width="156" height="30" fill="#FFFFFF" stroke="rgba(17,24,39,0.1)" />
      <text x="878" y="18" class="mono" font-size="9" fill="#4B5563" text-anchor="middle">SYS-DWG // 001</text>
      
      <!-- Footer details -->
      <line x1="0" y1="428" x2="956" y2="428" stroke="rgba(17, 24, 39, 0.1)" />
      <text x="24" y="446" class="mono" font-size="9" fill="#4B5563">SCALE 1:500</text>
      <text x="478" y="446" class="mono" font-size="9" fill="#4B5563" text-anchor="middle">DEMEURE AI — CAMPUS INFRASTRUCTURE MASTERPLAN</text>
      <text x="932" y="446" class="mono" font-size="9" fill="#355E3B" font-weight="bold" text-anchor="end">STATUS: AUTHENTICATED</text>
    </g>
  </g>

  <!-- 3. SPLIT DESCRIPTION SECTION -->
  <g transform="translate(32, 600)">
    <line x1="0" y1="0" x2="1856" y2="0" class="border-line" />
    
    <!-- Philosophy Column -->
    <g transform="translate(0, 32)">
      <text x="0" y="16" class="mono" font-size="10" fill="#4B5563">01 // SYSTEM PHILOSOPHY</text>
      
      <text x="0" y="60" class="heading" font-size="32">Beyond simple logistics.</text>
      <text x="0" y="100" class="heading" font-size="32">An infrastructure system.</text>
      
      <text x="0" y="140" class="body-text" font-size="14" fill="#4B5563">Traditional campus portals are transactional record stores. Demeure AI runs continuous</text>
      <text x="0" y="162" class="body-text" font-size="14" fill="#4B5563">background telemetry. By analyzing crowd density cycles, power load profiles, and kitchen</text>
      <text x="0" y="184" class="body-text" font-size="14" fill="#4B5563">supply utilization, the platform transforms from an administrative checklist into a proactive</text>
      <text x="0" y="206" class="body-text" font-size="14" fill="#4B5563">operations assistant.</text>
      
      <text x="0" y="260" class="heading" font-size="15" fill="#1E3A5F" font-style="italic">"The design of structural systems should prioritize systemic coordination over cosmetic aesthetics."</text>
      <text x="0" y="280" class="mono" font-size="9" fill="#4B5563">— Institutional Protocol Bulletin, 2026</text>
    </g>
    
    <!-- Feature cards Column -->
    <g transform="translate(900, 32)">
      <text x="0" y="16" class="mono" font-size="10" fill="#4B5563">02 // CORE INTELLIGENCE SUBSYSTEMS</text>
      
      <g transform="translate(0, 40)">
        <!-- Card 1 -->
        <g transform="translate(0, 0)">
          <rect width="450" height="96" fill="#FFFFFF" stroke="rgba(17, 24, 39, 0.1)" />
          <text x="16" y="28" class="heading" font-size="14" fill="#111827">Liveness Face Auth</text>
          <text x="16" y="52" class="mono" font-size="10" fill="#4B5563">Anti-spoofing security check-ins with blink analytics</text>
          <text x="16" y="68" class="mono" font-size="10" fill="#4B5563">and biometric vector log hashing.</text>
        </g>
        
        <!-- Card 2 -->
        <g transform="translate(480, 0)">
          <rect width="450" height="96" fill="#FFFFFF" stroke="rgba(17, 24, 39, 0.1)" />
          <text x="16" y="28" class="heading" font-size="14" fill="#111827">Energy Anomaly</text>
          <text x="16" y="52" class="mono" font-size="10" fill="#4B5563">Isolation Forest ML alerts predicting machine failures</text>
          <text x="16" y="68" class="mono" font-size="10" fill="#4B5563">and tracing vampire currents.</text>
        </g>

        <!-- Card 3 -->
        <g transform="translate(0, 120)">
          <rect width="450" height="96" fill="#FFFFFF" stroke="rgba(17, 24, 39, 0.1)" />
          <text x="16" y="28" class="heading" font-size="14" fill="#111827">Mess Optimization</text>
          <text x="16" y="52" class="mono" font-size="10" fill="#4B5563">Meal waste telemetry forecasting demand to adjust</text>
          <text x="16" y="68" class="mono" font-size="10" fill="#4B5563">menu lists sustainably.</text>
        </g>

        <!-- Card 4 -->
        <g transform="translate(480, 120)">
          <rect width="450" height="96" fill="#FFFFFF" stroke="rgba(17, 24, 39, 0.1)" />
          <text x="16" y="28" class="heading" font-size="14" fill="#111827">NLP Triage Desk</text>
          <text x="16" y="52" class="mono" font-size="10" fill="#4B5563">Automated ticketing prioritizing and classifying</text>
          <text x="16" y="68" class="mono" font-size="10" fill="#4B5563">student complaints.</text>
        </g>
      </g>
    </g>
  </g>
</svg>