<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Fonts Pre-load -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap');
      .heading { font-family: 'Outfit', 'Georgia', serif; font-weight: 700; fill: #111827; }
      .body-text { font-family: 'Inter', sans-serif; font-weight: 400; fill: #4B5563; }
      .body-bold { font-family: 'Inter', sans-serif; font-weight: 600; fill: #111827; }
      .mono { font-family: 'Courier New', Courier, monospace; fill: #1E3A5F; }
      .grid-lines { stroke: rgba(30, 58, 95, 0.03); stroke-width: 1; }
      .grid-lines-accent { stroke: rgba(30, 58, 95, 0.05); stroke-width: 0.5; }
      .border-line { stroke: rgba(17, 24, 39, 0.1); stroke-width: 1; }
    </style>
    
    <!-- Blueprint Grid Pattern (32x32px) -->
    <pattern id="blueprint-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" class="grid-lines" />
    </pattern>
    <!-- Blueprint Grid Accent Pattern (16x16px) -->
    <pattern id="blueprint-grid-accent" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" class="grid-lines-accent" />
    </pattern>
  </defs>

  <!-- 1. BASE CANVAS BACKGROUND -->
  <rect width="1920" height="1080" fill="#F8F6F2" />
  
  <!-- 2. BLUEPRINT GRID OVERLAY -->
  <rect width="1920" height="1080" fill="url(#blueprint-grid)" />
  <rect width="1920" height="1080" fill="url(#blueprint-grid-accent)" />

  <!-- 3. TOP NAVIGATION HEADER BAR -->
  <g id="Header-Bar">
    <rect x="0" y="0" width="1920" height="72" fill="#FFFFFF" />
    <line x1="0" y1="72" x2="1920" y2="72" class="border-line" />
    
    <!-- Title / Branding -->
    <text x="24" y="40" class="heading" font-size="20" letter-spacing="-0.02em">DEMEURE AI // COMMAND</text>
    <text x="24" y="55" class="mono" font-size="9" letter-spacing="0.1em">Institutional Campus OS</text>
    
    <!-- Core State Indicator -->
    <g transform="translate(340, 24)">
      <rect x="0" y="0" width="200" height="24" fill="rgba(53, 94, 59, 0.05)" stroke="rgba(53, 94, 59, 0.2)" stroke-width="1" />
      <circle cx="16" cy="12" r="4" fill="#355E3B" />
      <text x="30" y="16" class="mono" font-size="10" fill="#355E3B" font-weight="bold">CORE STATE: OPERATIONAL</text>
    </g>
    
    <!-- Live Time -->
    <text x="1300" y="42" class="mono" font-size="11" fill="#4B5563">14:35:37 | Sat, Jun 13</text>
    
    <!-- Persona Selector Mockup -->
    <g id="Persona-Selector" transform="translate(1500, 18)">
      <rect x="0" y="0" width="230" height="36" fill="#F8F6F2" stroke="rgba(17, 24, 39, 0.15)" stroke-width="1" />
      <text x="12" y="22" class="mono" font-size="11" fill="#111827" font-weight="bold">PERSONA: ADMIN</text>
      <path d="M 205 15 L 210 20 L 215 15" fill="none" stroke="#4B5563" stroke-width="1.5" />
    </g>
    
    <!-- Storyboard Button -->
    <g id="Storyboard-Btn" transform="translate(1750, 18)">
      <rect x="0" y="0" width="146" height="36" fill="#FFFFFF" stroke="rgba(17, 24, 39, 0.15)" stroke-width="1" />
      <text x="24" y="22" class="mono" font-size="10" fill="#4B5563" letter-spacing="0.05em">← STORYBOARD</text>
    </g>
  </g>

  <!-- 4. SIDEBAR NAVIGATION -->
  <g id="Sidebar-Navigation">
    <rect x="0" y="72" width="256" height="1008" fill="#FFFFFF" />
    <line x1="256" y1="72" x2="256" y2="1080" class="border-line" />
    
    <text x="24" y="110" class="mono" font-size="10" fill="#4B5563" letter-spacing="0.1em">SYSTEM SUB-PROTOCOLS</text>
    
    
    <!-- Item 1: OVERVIEW TELEMETRY -->
    <g transform="translate(12, 130)">
      <rect x="0" y="0" width="232" height="42" fill="none" />
      <text x="16" y="26" class="mono" font-size="11" fill="#111827">OVERVIEW TELEMETRY</text>
    </g>
    <!-- Item 2: ROOM ALLOCATION -->
    <g transform="translate(12, 180)">
      <rect x="0" y="0" width="232" height="42" fill="none" />
      <text x="16" y="26" class="mono" font-size="11" fill="#111827">ROOM ALLOCATION</text>
    </g>
    <!-- Item 3: STUDENT SURVEY FORM -->
    <g transform="translate(12, 230)">
      <rect x="0" y="0" width="232" height="42" fill="none" />
      <text x="16" y="26" class="mono" font-size="11" fill="#111827">STUDENT SURVEY FORM</text>
    </g>
    <!-- Item 4: POWER GRID DIAGNOSTICS -->
    <g transform="translate(12, 280)">
      <rect x="0" y="0" width="232" height="42" fill="none" />
      <text x="16" y="26" class="mono" font-size="11" fill="#111827">POWER GRID DIAGNOSTICS</text>
    </g>
    <!-- Item 5: SECURITY SOC GATE -->
    <g transform="translate(12, 330)">
      <rect x="0" y="0" width="232" height="42" fill="none" />
      <text x="16" y="26" class="mono" font-size="11" fill="#111827">SECURITY SOC GATE</text>
    </g>
    <!-- Item 6: NLP COMPLAINT DESK -->
    <g transform="translate(12, 380)">
      <rect x="0" y="0" width="232" height="42" fill="none" />
      <text x="16" y="26" class="mono" font-size="11" fill="#111827">NLP COMPLAINT DESK</text>
    </g>
    <!-- Item 7: MESS &amp; FOOD OPTIMIZER -->
    <g transform="translate(12, 430)">
      <rect x="0" y="0" width="232" height="42" fill="none" />
      <text x="16" y="26" class="mono" font-size="11" fill="#111827">MESS &amp; FOOD OPTIMIZER</text>
    </g>
    <!-- Item 8: WELFARE OPERATIONS (Active) -->
    <g transform="translate(12, 480)">
      <rect x="0" y="0" width="232" height="42" fill="#1E3A5F" />
      <text x="16" y="26" class="mono" font-size="11" fill="#FFFFFF" font-weight="bold">WELFARE OPERATIONS</text>
      <path d="M 210 16 L 215 21 L 210 26" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
    </g>
    <!-- Item 9: AI HANDBOOK RAG -->
    <g transform="translate(12, 530)">
      <rect x="0" y="0" width="232" height="42" fill="none" />
      <text x="16" y="26" class="mono" font-size="11" fill="#111827">AI HANDBOOK RAG</text>
    </g>

    <!-- Sidebar Footer Telemetry -->
    <g transform="translate(24, 1000)" class="mono" font-size="9" fill="#4B5563">
      <text x="0" y="0">HOSTEL ID: DE-DELHI-09</text>
      <text x="0" y="15">STITCH_NODE: ACTIVE</text>
      <text x="0" y="30">VER: 1.0.4 // LTS</text>
    </g>
  </g>

  <!-- 5. MAIN CONTENT AREA -->
  <g id="Main-Content" transform="translate(288, 104)">
    
    <!-- Module Header -->
    <g id="Content-Header">
      <text x="0" y="0" class="mono" font-size="11" fill="#4B5563" letter-spacing="0.2em">MODULE // 06</text>
      <text x="0" y="32" class="heading" font-size="32" font-family="'Outfit', sans-serif">Resident Welfare &amp; System Diagnostics</text>
      <line x1="0" y1="50" x2="1600" y2="50" class="border-line" />
    </g>
    
    
    <g transform="translate(0, 72)">
      <!-- Privacy Statement Intro Banner -->
      <g transform="translate(0, 0)">
        <rect width="1600" height="72" fill="#FFFFFF" stroke="rgba(17, 24, 39, 0.1)" />
        <g transform="translate(24, 16)">
          <text x="0" y="12" class="heading" font-size="13" fill="#1E3A5F">Welfare Diagnostic Engine Ethics Statement</text>
          <text x="0" y="32" class="mono" font-size="10" fill="#4B5563">The system logs only operational swiping entries and complaint keywords. No personal devices or audio streams are monitored.</text>
        </g>
      </g>
      
      <!-- Content Grid -->
      <g transform="translate(0, 96)">
        <!-- Left Column: Active warnings list -->
        <g transform="translate(0, 0)">
          <rect width="980" height="500" fill="#FFFFFF" stroke="rgba(17, 24, 39, 0.1)" />
          
          <g transform="translate(24, 24)">
            <text x="0" y="16" class="heading" font-size="18">Active Operational Welfare Warnings</text>
            <line x1="0" y1="28" x2="932" y2="28" class="border-line" />
            
            <!-- Alert 1 -->
            <g transform="translate(0, 48)">
              <rect width="932" height="100" fill="rgba(211, 47, 47, 0.03)" stroke="rgba(211, 47, 47, 0.2)" />
              
              <g transform="translate(16, 16)">
                <text x="0" y="16" class="mono" font-size="11" fill="#111827" font-weight="bold">Dev Sharma (RM-102)</text>
                
                <rect x="180" y="2" width="100" height="18" fill="none" stroke="#D32F2F" stroke-width="1" />
                <text x="230" y="14" class="mono" font-size="8" fill="#D32F2F" font-weight="bold" text-anchor="middle">UNRESOLVED</text>
                
                <text x="0" y="46" class="heading" font-size="14" fill="#111827">Zero Gate Swipe &amp; Zero Mess Log</text>
                <text x="0" y="64" class="mono" font-size="10" fill="#4B5563">Duration Threshold: 36 Hours</text>
                
                <!-- Action button -->
                <rect x="700" y="12" width="200" height="32" fill="#1E3A5F" />
                <text x="800" y="32" class="mono" font-size="9" fill="#FFFFFF" font-weight="bold" text-anchor="middle">QUIET CHECK DONE</text>
              </g>
            </g>

            <!-- Alert 2 -->
            <g transform="translate(0, 164)">
              <rect width="932" height="100" fill="rgba(211, 47, 47, 0.03)" stroke="rgba(211, 47, 47, 0.2)" />
              
              <g transform="translate(16, 16)">
                <text x="0" y="16" class="mono" font-size="11" fill="#111827" font-weight="bold">Kabir Malhotra (RM-104)</text>
                
                <rect x="210" y="2" width="100" height="18" fill="none" stroke="#D32F2F" stroke-width="1" />
                <text x="260" y="14" class="mono" font-size="8" fill="#D32F2F" font-weight="bold" text-anchor="middle">UNRESOLVED</text>
                
                <text x="0" y="46" class="heading" font-size="14" fill="#111827">Consecutive Absenteeism Pattern</text>
                <text x="0" y="64" class="mono" font-size="10" fill="#4B5563">Duration Threshold: 48 Hours</text>
                
                <!-- Action button -->
                <rect x="700" y="12" width="200" height="32" fill="#1E3A5F" />
                <text x="800" y="32" class="mono" font-size="9" fill="#FFFFFF" font-weight="bold" text-anchor="middle">QUIET CHECK DONE</text>
              </g>
            </g>

            <!-- Alert 3 -->
            <g transform="translate(0, 280)">
              <rect width="932" height="80" fill="#F8F6F2" stroke="rgba(17, 24, 39, 0.1)" />
              
              <g transform="translate(16, 16)">
                <text x="0" y="16" class="mono" font-size="11" fill="#111827" font-weight="bold">Vikram Rao (RM-105)</text>
                
                <rect x="180" y="2" width="80" height="18" fill="none" stroke="#355E3B" stroke-width="1" />
                <text x="220" y="14" class="mono" font-size="8" fill="#355E3B" font-weight="bold" text-anchor="middle">CHECKED</text>
                
                <text x="0" y="46" class="heading" font-size="14" fill="#4B5563">High Complaint Stress Words (Completed Check)</text>
              </g>
            </g>
          </g>
        </g>
        
        <!-- Right Column: Institutional Safety Telemetry -->
        <g transform="translate(1004, 0)">
          <rect width="596" height="500" fill="#FFFFFF" stroke="rgba(17, 24, 39, 0.1)" />
          
          <g transform="translate(24, 24)">
            <text x="0" y="16" class="heading" font-size="18">Institutional Safety Telemetry</text>
            <line x1="0" y1="28" x2="548" y2="28" class="border-line" />
            
            <g transform="translate(0, 48)">
              <text x="0" y="20" class="mono" font-size="11" fill="#4B5563">Mean Activity Index</text>
              <text x="548" y="20" class="mono" font-size="11" fill="#111827" font-weight="bold" text-anchor="end">94.2% (Nominal)</text>
              <line x1="0" y1="32" x2="548" y2="32" stroke="rgba(17,24,39,0.05)" />
              
              <text x="0" y="60" class="mono" font-size="11" fill="#4B5563">Welfare Check Trigger Rate</text>
              <text x="548" y="60" class="mono" font-size="11" fill="#111827" font-weight="bold" text-anchor="end">0.48% Residents / Wk</text>
              <line x1="0" y1="72" x2="548" y2="72" stroke="rgba(17,24,39,0.05)" />
              
              <text x="0" y="100" class="mono" font-size="11" fill="#4B5563">False Alarm Ratio</text>
              <text x="548" y="100" class="mono" font-size="11" fill="#355E3B" font-weight="bold" text-anchor="end">3.2% (Highly Accurate)</text>
              <line x1="0" y1="112" x2="548" y2="112" stroke="rgba(17,24,39,0.05)" />
            </g>
            
            <!-- Emergency Protocol Card -->
            <g transform="translate(0, 240)">
              <rect width="548" height="180" fill="#F8F6F2" stroke="rgba(17, 24, 39, 0.15)" />
              
              <g transform="translate(16, 16)">
                <text x="0" y="16" class="heading" font-size="13" fill="#1E3A5F">EMERGENCY PROTOCOLS</text>
                <text x="0" y="44" class="mono" font-size="10" fill="#4B5563" width="500">
                  In the event of medical or structural alarms, wardens click 'Initiate Broad Dispatch' from their physical keypads. Demeure AI broadcasts details to campus security and the institution medical desk in parallel.
                </text>
                
                <rect x="0" y="100" width="516" height="36" fill="#D32F2F" />
                <text x="258" y="122" class="mono" font-size="10" fill="#FFFFFF" font-weight="bold" text-anchor="middle">INITIATE BROAD DISPATCH (EMERGENCY)</text>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
    
  </g>
</svg>