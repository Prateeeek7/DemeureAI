      .heading { font-family: 'Outfit', 'Georgia', serif; font-weight: 700; fill: #111827; }
      .body-text { font-family: 'Inter', sans-serif; font-weight: 400; fill: #4B5563; }
      .body-bold { font-family: 'Inter', sans-serif; font-weight: 600; fill: #111827; }
      .mono { font-family: 'Courier New', Courier, monospace; fill: #1E3A5F; }
      .grid-lines { stroke: rgba(30, 58, 95, 0.03); stroke-width: 1; }
      .grid-lines-accent { stroke: rgba(30, 58, 95, 0.05); stroke-width: 0.5; }
      .border-line { stroke: rgba(17, 24, 39, 0.1); stroke-width: 1; }
    </style>
    
    <!-- Blueprint Grid Pattern (32x32px) -->
    <pattern id="blueprint-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" class="grid-lines" />
    </pattern>
    <!-- Blueprint Grid Accent Pattern (16x16px) -->
    <pattern id="blueprint-grid-accent" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" class="grid-lines-accent" />
