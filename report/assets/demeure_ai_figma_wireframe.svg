<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Fonts Pre-load -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap');
      .heading { font-family: 'Outfit', 'Georgia', serif; font-weight: 700; fill: #111827; }
      .body-text { font-family: 'Inter', sans-serif; font-weight: 400; fill: #4B5563; }
      .body-bold { font-family: 'Inter', sans-serif; font-weight: 600; fill: #111827; }
      .mono { font-family: 'Courier New', Courier, monospace; fill: #1E3A5F; }
      .grid-lines { stroke: rgba(30, 58, 95, 0.03); stroke-width: 1; }
      .grid-lines-accent { stroke: rgba(30, 58, 95, 0.05); stroke-width: 0.5; }
      .border-line { stroke: rgba(17, 24, 39, 0.1); stroke-width: 1; }
    </style>
    
    <!-- Blueprint Grid Pattern (32x32px) -->
    <pattern id="blueprint-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" class="grid-lines" />
    </pattern>
    <!-- Blueprint Grid Accent Pattern (16x16px) -->
    <pattern id="blueprint-grid-accent" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" class="grid-lines-accent" />
    </pattern>
  </defs>

  <!-- 1. BASE CANVAS BACKGROUND -->
  <rect width="1920" height="1080" fill="#F8F6F2" />
  
  <!-- 2. BLUEPRINT GRID OVERLAY -->
  <rect width="1920" height="1080" fill="url(#blueprint-grid)" />
  <rect width="1920" height="1080" fill="url(#blueprint-grid-accent)" />

  <!-- 3. TOP NAVIGATION HEADER BAR -->
  <g id="Header-Bar">
    <rect x="0" y="0" width="1920" height="72" fill="#FFFFFF" />
    <line x1="0" y1="72" x2="1920" y2="72" class="border-line" />
    
    <!-- Title / Branding -->
    <text x="24" y="40" class="heading" font-size="20" letter-spacing="-0.02em">DEMEURE AI // COMMAND</text>
    <text x="24" y="55" class="mono" font-size="9" letter-spacing="0.1em">Institutional Campus OS</text>
    
    <!-- Core State Indicator -->
    <rect x="340" y="24" width="200" height="24" fill="rgba(53, 94, 59, 0.05)" stroke="rgba(53, 94, 59, 0.2)" stroke-width="1" />
    <circle cx="356" cy="36" r="4" fill="#355E3B" />
    <text x="370" y="40" class="mono" font-size="10" fill="#355E3B" font-weight="bold">CORE STATE: OPERATIONAL</text>
    
    <!-- Live Time -->
    <text x="1300" y="42" class="mono" font-size="11" fill="#4B5563">14:35:37 | Sat, Jun 13</text>
    
    <!-- Persona Selector Mockup -->
    <g id="Persona-Selector" transform="translate(1500, 18)">
      <rect x="0" y="0" width="230" height="36" fill="#F8F6F2" stroke="rgba(17, 24, 39, 0.15)" stroke-width="1" />
      <text x="12" y="22" class="mono" font-size="11" fill="#111827" font-weight="bold">PERSONA: ADMIN</text>
      <path d="M 205 15 L 210 20 L 215 15" fill="none" stroke="#4B5563" stroke-width="1.5" />
    </g>
    
    <!-- Storyboard Button -->
    <g id="Storyboard-Btn" transform="translate(1750, 18)">
      <rect x="0" y="0" width="146" height="36" fill="#FFFFFF" stroke="rgba(17, 24, 39, 0.15)" stroke-width="1" />
      <text x="24" y="22" class="mono" font-size="10" fill="#4B5563" letter-spacing="0.05em">← STORYBOARD</text>
    </g>
  </g>

  <!-- 4. SIDEBAR NAVIGATION -->
  <g id="Sidebar-Navigation">
    <rect x="0" y="72" width="256" height="1008" fill="#FFFFFF" />
    <line x1="256" y1="72" x2="256" y2="1080" class="border-line" />
    
    <text x="24" y="110" class="mono" font-size="10" fill="#4B5563" letter-spacing="0.1em">SYSTEM SUB-PROTOCOLS</text>
    
    <!-- Nav Items -->
    <!-- Item 1: Overview Telemetry (Active) -->
    <g transform="translate(12, 130)">
      <rect x="0" y="0" width="232" height="42" fill="#1E3A5F" />
      <text x="16" y="26" class="mono" font-size="11" fill="#FFFFFF" font-weight="bold">OVERVIEW TELEMETRY</text>
      <path d="M 210 16 L 215 21 L 210 26" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
    </g>
    
    <!-- Item 2: Room Allocation -->
    <g transform="translate(12, 180)">
      <rect x="0" y="0" width="232" height="42" fill="none" />
      <text x="16" y="26" class="mono" font-size="11" fill="#111827">ROOM ALLOCATION</text>
    </g>
    
    <!-- Item 3: Student Survey Form -->
    <g transform="translate(12, 230)">
      <rect x="0" y="0" width="232" height="42" fill="none" />
      <text x="16" y="26" class="mono" font-size="11" fill="#111827">STUDENT SURVEY FORM</text>
    </g>
    
    <!-- Item 4: Power Grid Diagnostics -->
    <g transform="translate(12, 280)">
      <rect x="0" y="0" width="232" height="42" fill="none" />
      <text x="16" y="26" class="mono" font-size="11" fill="#111827">POWER GRID DIAGNOSTICS</text>
    </g>
    
    <!-- Item 5: Security SOC Gate -->
    <g transform="translate(12, 330)">
      <rect x="0" y="0" width="232" height="42" fill="none" />
      <text x="16" y="26" class="mono" font-size="11" fill="#111827">SECURITY SOC GATE</text>
    </g>
    
    <!-- Item 6: NLP Complaint Desk -->
    <g transform="translate(12, 380)">
      <rect x="0" y="0" width="232" height="42" fill="none" />
      <text x="16" y="26" class="mono" font-size="11" fill="#111827">NLP COMPLAINT DESK</text>
    </g>
    
    <!-- Item 7: Mess & Food Optimizer -->
    <g transform="translate(12, 430)">
      <rect x="0" y="0" width="232" height="42" fill="none" />
      <text x="16" y="26" class="mono" font-size="11" fill="#111827">MESS &amp; FOOD OPTIMIZER</text>
    </g>
    
    <!-- Item 8: Welfare Operations -->
    <g transform="translate(12, 480)">
      <rect x="0" y="0" width="232" height="42" fill="none" />
      <text x="16" y="26" class="mono" font-size="11" fill="#111827">WELFARE OPERATIONS</text>
    </g>

    <!-- Item 9: AI Handbook RAG -->
    <g transform="translate(12, 530)">
      <rect x="0" y="0" width="232" height="42" fill="none" />
      <text x="16" y="26" class="mono" font-size="11" fill="#111827">AI HANDBOOK RAG</text>
    </g>

    <!-- Sidebar Footer Telemetry -->
    <g transform="translate(24, 1000)" class="mono" font-size="9" fill="#4B5563">
      <text x="0" y="0">HOSTEL ID: DE-DELHI-09</text>
      <text x="0" y="15">STITCH_NODE: ACTIVE</text>
      <text x="0" y="30">VER: 1.0.4 // LTS</text>
    </g>
  </g>

  <!-- 5. MAIN CONTENT AREA -->
  <g id="Main-Content" transform="translate(288, 104)">
    
    <!-- Module Header -->
    <g id="Content-Header">
      <text x="0" y="0" class="mono" font-size="11" fill="#4B5563" letter-spacing="0.2em">MODULE // 00</text>
      <text x="0" y="32" class="heading" font-size="32" font-family="'Outfit', sans-serif">Demeure AI: Operational Vitals Overview</text>
      <line x1="0" y1="50" x2="1600" y2="50" class="border-line" />
    </g>

    <!-- Content Grid Row 1: Telemetry KPI Cards -->
    <g id="KPI-Cards" transform="translate(0, 72)">
      
      <!-- KPI Card 1: Power Status -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="376" height="120" fill="#FFFFFF" stroke="rgba(17, 24, 39, 0.1)" stroke-width="1" />
        <text x="20" y="30" class="mono" font-size="10" fill="#4B5563" letter-spacing="0.05em">TOTAL POWER DRAW (LIVE)</text>
        <text x="20" y="75" class="heading" font-size="36">44.8 kW</text>
        <text x="20" y="100" class="mono" font-size="10" fill="#355E3B" font-weight="bold">-6.2% VS BASELINE</text>
      </g>
      
      <!-- KPI Card 2: Biometrics checkins -->
      <g transform="translate(408, 0)">
        <rect x="0" y="0" width="376" height="120" fill="#FFFFFF" stroke="rgba(17, 24, 39, 0.1)" stroke-width="1" />
        <text x="20" y="30" class="mono" font-size="10" fill="#4B5563" letter-spacing="0.05em">BIOMETRICS GATE LIVENESS</text>
        <text x="20" y="75" class="heading" font-size="36">100.0%</text>
        <text x="20" y="100" class="mono" font-size="10" fill="#355E3B" font-weight="bold">ALL VECTORS SECURED</text>
      </g>

      <!-- KPI Card 3: Mess Waste -->
      <g transform="translate(816, 0)">
        <rect x="0" y="0" width="376" height="120" fill="#FFFFFF" stroke="rgba(17, 24, 39, 0.1)" stroke-width="1" />
        <text x="20" y="30" class="mono" font-size="10" fill="#4B5563" letter-spacing="0.05em">DIETARY WASTE CALIBRATION</text>
        <text x="20" y="75" class="heading" font-size="36">-34.2%</text>
        <text x="20" y="100" class="mono" font-size="10" fill="#355E3B" font-weight="bold">YoY WASTE REDUCTION</text>
      </g>

      <!-- KPI Card 4: Welfare checks -->
      <g transform="translate(1224, 0)">
        <rect x="0" y="0" width="376" height="120" fill="#FFFFFF" stroke="rgba(17, 24, 39, 0.1)" stroke-width="1" />
        <text x="20" y="30" class="mono" font-size="10" fill="#4B5563" letter-spacing="0.05em">ACTIVE WELFARE DIAGNOSTICS</text>
        <text x="20" y="75" class="heading" font-size="36">1 Alert</text>
        <text x="20" y="100" class="mono" font-size="10" fill="#D32F2F" font-weight="bold">WARDEN ACTION REQUIRED</text>
      </g>
    </g>

    <!-- Content Grid Row 2: Diagnostics & Graphical Analysis -->
    <g id="Diagnostics-Grid" transform="translate(0, 224)">
      
      <!-- Graph Container Block (Left Column) -->
      <g id="Power-Graph" transform="translate(0, 0)">
        <rect x="0" y="0" width="1050" height="420" fill="#FFFFFF" stroke="rgba(17, 24, 39, 0.1)" stroke-width="1" />
        
        <text x="24" y="36" class="heading" font-size="18">Power Load Diagnostics Framework</text>
        <text x="24" y="55" class="mono" font-size="10" fill="#4B5563">Isolation Forest Anomaly Isolation Map (Block A)</text>
        <line x1="24" y1="70" x2="1026" y2="70" class="border-line" />
        
        <!-- Y-Axis Labels -->
        <g transform="translate(24, 85)" class="mono" font-size="9" fill="#4B5563" text-anchor="end">
          <text x="30" y="20">250 kW</text>
          <text x="30" y="80">200 kW</text>
          <text x="30" y="140">150 kW</text>
          <text x="30" y="200">100 kW</text>
          <text x="30" y="260">50 kW</text>
          <text x="30" y="320">0 kW</text>
        </g>
        
        <!-- Grid lines inside chart -->
        <path d="M 64 105 L 1026 105 M 64 165 L 1026 165 M 64 225 L 1026 225 M 64 285 L 1026 285 M 64 345 L 1026 345 M 64 405 L 1026 405" stroke="rgba(17,24,39,0.03)" stroke-width="1" />
        
        <!-- Graph Area Fill & Strokes -->
        <!-- Expected baseline (gray dashed path) -->
        <path d="M 80 345 L 200 320 L 320 280 L 440 240 L 560 270 L 680 300 L 800 220 L 920 180 L 1020 230" fill="none" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 5" />
        <!-- Actual consumption (solid blue path) -->
        <path d="M 80 350 L 200 300 L 320 290 L 440 120 L 560 310 L 680 320 L 800 200 L 920 150 L 1020 210" fill="none" stroke="#1E3A5F" stroke-width="2.5" />
        
        <!-- Anomaly Node Point -->
        <circle cx="440" cy="120" r="6" fill="#D32F2F" />
        <circle cx="440" cy="120" r="12" fill="none" stroke="#D32F2F" stroke-width="1.5" stroke-dasharray="2 2" />
        <rect x="450" y="90" width="160" height="40" fill="#111827" />
        <text x="460" y="106" class="mono" font-size="9" fill="#FFFFFF">SPIKE: +1.8 kW</text>
        <text x="460" y="122" class="mono" font-size="9" fill="#FFFFFF">CONFIDENCE: 94.6%</text>

        <!-- X-Axis Labels -->
        <g class="mono" font-size="9" fill="#4B5563" text-anchor="middle">
          <text x="80" y="435">08:00</text>
          <text x="200" y="435">10:00</text>
          <text x="320" y="435">12:00 (SPIKE)</text>
          <text x="440" y="435">14:00</text>
          <text x="560" y="435">16:00</text>
          <text x="680" y="435">18:00</text>
          <text x="800" y="435">20:00</text>
          <text x="920" y="435">22:00</text>
        </g>
      </g>

      <!-- Network Node Illustration (Right Column) -->
      <g id="Network-Mockup" transform="translate(1082, 0)">
        <rect x="0" y="0" width="518" height="420" fill="#FFFFFF" stroke="rgba(17, 24, 39, 0.1)" stroke-width="1" />
        <text x="24" y="36" class="heading" font-size="18">Demeure Network Nodes</text>
        <text x="24" y="55" class="mono" font-size="10" fill="#4B5563">Active Telemetry Routing Matrix</text>
        <line x1="24" y1="70" x2="494" y2="70" class="border-line" />

        <!-- Mock SVG node drawings -->
        <g transform="translate(60, 100)">
          <!-- Node 1: Biometrics -->
          <rect x="0" y="40" width="90" height="60" fill="none" stroke="#1E3A5F" stroke-width="1.5" />
          <text x="45" y="75" class="mono" font-size="9" font-weight="bold" text-anchor="middle">BIOMETRIC</text>
          
          <!-- Node 2: Power -->
          <rect x="150" y="0" width="90" height="60" fill="none" stroke="#1E3A5F" stroke-width="1.5" />
          <text x="195" y="35" class="mono" font-size="9" font-weight="bold" text-anchor="middle">POWER_ML</text>
          
          <!-- Node 3: Mess -->
          <rect x="150" y="110" width="90" height="60" fill="none" stroke="#1E3A5F" stroke-width="1.5" />
          <text x="195" y="145" class="mono" font-size="9" font-weight="bold" text-anchor="middle">MESS_CAL</text>
          
          <!-- Node 4: Ledger -->
          <rect x="300" y="40" width="90" height="60" fill="none" stroke="#1E3A5F" stroke-width="1.5" />
          <text x="345" y="75" class="mono" font-size="9" font-weight="bold" text-anchor="middle">LEDGER_DB</text>

          <!-- Vector path links -->
          <path d="M 90 70 L 150 30 M 90 70 L 150 140 M 240 30 L 300 70 M 240 140 L 300 70" fill="none" stroke="#1E3A5F" stroke-dasharray="3 3" stroke-width="1" />
        </g>
        
        <rect x="24" y="340" width="470" height="56" fill="#F8F6F2" stroke="rgba(17, 24, 39, 0.05)" stroke-width="1" />
        <text x="36" y="372" class="mono" font-size="10" fill="#1E3A5F" font-weight="bold">DIAGNOSTIC STATUS: NOMINAL TELEMETRY STREAM</text>
      </g>
    </g>

    <!-- Content Grid Row 3: Active Systems Table -->
    <g id="Active-Systems" transform="translate(0, 676)">
      <rect x="0" y="0" width="1600" height="240" fill="#FFFFFF" stroke="rgba(17, 24, 39, 0.1)" stroke-width="1" />
      
      <text x="24" y="36" class="heading" font-size="18">Core Operational Subsystems</text>
      <text x="24" y="55" class="mono" font-size="10" fill="#4B5563">SLA Status Matrix &amp; Logging Register</text>
      <line x1="24" y1="70" x2="1576" y2="70" class="border-line" />
      
      <!-- Table Header -->
      <g transform="translate(24, 90)" class="mono" font-size="10" fill="#4B5563" font-weight="bold">
        <text x="10" y="0">NODE ID</text>
        <text x="150" y="0">SUBSYSTEM FUNCTION</text>
        <text x="450" y="0">LOG STATUS</text>
        <text x="750" y="0">SLA RESPONSE TARGET</text>
        <text x="1050" y="0">OPERATIONAL NODE CAPACITY</text>
        <text x="1350" y="0">STATUS</text>
      </g>
      
      <!-- Table Rows -->
      <!-- Row 1 -->
      <g transform="translate(24, 120)" class="mono" font-size="11">
        <text x="10" y="0" fill="#1E3A5F" font-weight="bold">SOC-G1</text>
        <text x="150" y="0" fill="#111827">Biometric Gate Liveness Authentication</text>
        <text x="450" y="0" fill="#4B5563">Blink &amp; Pose Vector validation</text>
        <text x="750" y="0" fill="#111827">Instant (&lt; 2s)</text>
        <text x="1050" y="0" fill="#111827">412 Active residents</text>
        <rect x="1350" y="-12" width="90" height="18" fill="rgba(53, 94, 59, 0.05)" stroke="rgba(53, 94, 59, 0.2)" />
        <text x="1395" y="1" font-size="9" fill="#355E3B" font-weight="bold" text-anchor="middle">ONLINE</text>
      </g>
      <line x1="24" y1="135" x2="1576" y2="135" stroke="rgba(17,24,39,0.05)" stroke-width="1" />

      <!-- Row 2 -->
      <g transform="translate(24, 155)" class="mono" font-size="11">
        <text x="10" y="0" fill="#1E3A5F" font-weight="bold">PWR-Z_C</text>
        <text x="150" y="0" fill="#111827">Power Diagnostics Isolation Forest</text>
        <text x="450" y="0" fill="#4B5563">Water Pump vibration alerts</text>
        <text x="750" y="0" fill="#111827">12 Hours SLA</text>
        <text x="1050" y="0" fill="#111827">Zone A, B &amp; Mess Halls</text>
        <rect x="1350" y="-12" width="90" height="18" fill="rgba(211, 47, 47, 0.05)" stroke="rgba(211, 47, 47, 0.2)" />
        <text x="1395" y="1" font-size="9" fill="#D32F2F" font-weight="bold" text-anchor="middle">1 ALERT</text>
      </g>
      <line x1="24" y1="170" x2="1576" y2="170" stroke="rgba(17,24,39,0.05)" stroke-width="1" />

      <!-- Row 3 -->
      <g transform="translate(24, 190)" class="mono" font-size="11">
        <text x="10" y="0" fill="#1E3A5F" font-weight="bold">MESS-OP</text>
        <text x="150" y="0" fill="#111827">Dietary Attendance Forecasting</text>
        <text x="450" y="0" fill="#4B5563">Procurement scale orders</text>
        <text x="750" y="0" fill="#111827">Weekly updates</text>
        <text x="1050" y="0" fill="#111827">4 Meals / Day</text>
        <rect x="1350" y="-12" width="90" height="18" fill="rgba(53, 94, 59, 0.05)" stroke="rgba(53, 94, 59, 0.2)" />
        <text x="1395" y="1" font-size="9" fill="#355E3B" font-weight="bold" text-anchor="middle">ONLINE</text>
      </g>
    </g>
  </g>
</svg>
