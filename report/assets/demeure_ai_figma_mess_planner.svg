                <rect x="20" y="80" width="16" height="180" fill="#1E3A5F" />
                <text x="18" y="275" class="mono" font-size="9" fill="#4B5563" text-anchor="middle">Wed</text>
              </g>

              <!-- Thu -->
              <g transform="translate(440, 0)">
                <rect x="0" y="80" width="16" height="180" fill="rgba(30,58,95,0.1)" />
                <rect x="20" y="76" width="16" height="184" fill="#1E3A5F" />
                <text x="18" y="275" class="mono" font-size="9" fill="#4B5563" text-anchor="middle">Thu</text>
              </g>

              <!-- Fri -->
