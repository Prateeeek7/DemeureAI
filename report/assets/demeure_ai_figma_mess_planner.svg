            <text x="16" y="20" class="mono" font-size="10" fill="#FFFFFF" font-weight="bold">DAY</text>
            <text x="120" y="20" class="mono" font-size="10" fill="#FFFFFF" font-weight="bold">BREAKFAST</text>
            <text x="360" y="20" class="mono" font-size="10" fill="#FFFFFF" font-weight="bold">LUNCH</text>
            <text x="640" y="20" class="mono" font-size="10" fill="#FFFFFF" font-weight="bold">SNACKS</text>
            <text x="800" y="20" class="mono" font-size="10" fill="#FFFFFF" font-weight="bold">DINNER</text>
            
