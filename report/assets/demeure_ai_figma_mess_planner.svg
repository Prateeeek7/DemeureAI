                <rect x="0" y="0" width="12" height="12" fill="rgba(30,58,95,0.1)" />
                <text x="18" y="10" class="mono" font-size="9" fill="#4B5563">Forecasted Load</text>
                
                <rect x="0" y="20" width="12" height="12" fill="#1E3A5F" />
                <text x="18" y="30" class="mono" font-size="9" fill="#4B5563">Actual Scanned</text>
              </g>
            </g>
          </g>
        </g>
      </g>
      
      <!-- Right Column: Student Reviews -->
      <g transform="translate(1082, 0)">
        <rect width="518" height="700" fill="#FFFFFF" stroke="rgba(17, 24, 39, 0.1)" />
        
        <g transform="translate(24, 24)">
          <text x="0" y="16" class="heading" font-size="18">Student Review Analytics</text>
          <line x1="0" y1="28" x2="470" y2="28" class="border-line" />
          
          <!-- Rating Summary block -->
