            <text x="0" y="16" class="heading" font-size="16">Attendance &amp; Food Consumption Forecast</text>
            <line x1="0" y1="24" x2="1002" y2="24" class="border-line" />
            
            <g transform="translate(24, 48)">
              <!-- Y Axis -->
