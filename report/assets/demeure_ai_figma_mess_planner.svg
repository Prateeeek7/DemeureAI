              <text x="360" y="24" class="mono" font-size="9" fill="#4B5563">Dal Makhani, Jeera Rice, Chapati</text>
              <text x="640" y="24" class="mono" font-size="9" fill="#4B5563">Chai &amp; Samosa</text>
              <text x="800" y="24" class="mono" font-size="9" fill="#4B5563">Paneer Butter Masala, Naan</text>
              <line x1="0" y1="38" x2="1002" y2="38" stroke="rgba(17,24,39,0.05)" />
            </g>
            
            <!-- Tue Row -->
