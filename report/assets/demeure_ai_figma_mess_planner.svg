              <text x="16" y="24" class="mono" font-size="10" fill="#111827" font-weight="bold">Tuesday</text>
              <text x="120" y="24" class="mono" font-size="9" fill="#4B5563">Idli-Sambhar with Chutney</text>
              <text x="360" y="24" class="mono" font-size="9" fill="#4B5563">Rajma Chawal, Roti, Cucumber Salad</text>
              <text x="640" y="24" class="mono" font-size="9" fill="#4B5563">Banana &amp; Chana</text>
              <text x="800" y="24" class="mono" font-size="9" fill="#4B5563">Aloo Matar, Roti, Dal Tadka</text>
              <line x1="0" y1="38" x2="1002" y2="38" stroke="rgba(17,24,39,0.05)" />
