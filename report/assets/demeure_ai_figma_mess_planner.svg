                <text x="446" y="12" class="mono" font-size="9" fill="#4B5563" text-anchor="end">08:30 PM</text>
                
                <text x="0" y="28" class="mono" font-size="9" fill="#355E3B" font-weight="bold">★★★★★ (Dinner)</text>
                <text x="0" y="46" class="mono" font-size="10" fill="#111827" font-style="italic">"Loved the lentil curry today! Very home-like flavor."</text>
              </g>
            </g>

            <!-- Review 2 -->
