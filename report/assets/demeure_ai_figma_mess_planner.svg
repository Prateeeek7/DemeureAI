                <text x="446" y="12" class="mono" font-size="9" fill="#4B5563" text-anchor="end">01:15 PM</text>
                
                <text x="0" y="28" class="mono" font-size="9" fill="#D32F2F" font-weight="bold">★★☆☆☆ (Lunch)</text>
                <text x="0" y="46" class="mono" font-size="10" fill="#111827" font-style="italic">"The quinoa bowl was dry. Can we get sauce on the side?"</text>
              </g>
            </g>

            <!-- Review 3 -->
            <g transform="translate(0, 240)">
              <rect width="470" height="96" fill="#F8F6F2" stroke="rgba(17, 24, 39, 0.1)" />
              <g transform="translate(12, 12)">
                <text x="0" y="12" class="mono" font-size="10" fill="#111827" font-weight="bold">Ananya Patel</text>
                <text x="446" y="12" class="mono" font-size="9" fill="#4B5563" text-anchor="end">Yesterday</text>
                
                <text x="0" y="28" class="mono" font-size="9" fill="#1E3A5F" font-weight="bold">★★★★☆ (Breakfast)</text>
