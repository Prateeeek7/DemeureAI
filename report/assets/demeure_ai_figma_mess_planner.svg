              <text x="30" y="80" class="mono" font-size="9" fill="#4B5563">300</text>
              <text x="30" y="140" class="mono" font-size="9" fill="#4B5563">200</text>
              <text x="30" y="200" class="mono" font-size="9" fill="#4B5563">100</text>
              <text x="30" y="260" class="mono" font-size="9" fill="#4B5563">0</text>
              
              <!-- Chart bar indicators -->
              <!-- Mon -->
              <g transform="translate(80, 0)">
                <rect x="0" y="60" width="16" height="200" fill="rgba(30,58,95,0.1)" />
                <rect x="20" y="65" width="16" height="195" fill="#1E3A5F" />
                <text x="18" y="275" class="mono" font-size="9" fill="#4B5563" text-anchor="middle">Mon</text>
              </g>
              
              <!-- Tue -->
