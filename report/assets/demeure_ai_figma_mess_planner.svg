              <text x="120" y="24" class="mono" font-size="9" fill="#4B5563">Paratha with Curd &amp; Pickle</text>
              <text x="360" y="24" class="mono" font-size="9" fill="#4B5563">Chole Bhature, Onion Salad</text>
              <text x="640" y="24" class="mono" font-size="9" fill="#4B5563">Bread Pakoda &amp; Chutney</text>
