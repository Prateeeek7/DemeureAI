              <rect x="24" y="14" width="24" height="8" fill="#1E3A5F" />
              <text x="150" y="22" class="mono" font-size="8" fill="#4B5563">20%</text>

              <text x="0" y="34" class="mono" font-size="8" fill="#4B5563">3 ★</text>
              <rect x="24" y="26" width="120" height="8" fill="rgba(17,24,39,0.05)" />
              <rect x="24" y="26" width="24" height="8" fill="#1E3A5F" />
              <text x="150" y="34" class="mono" font-size="8" fill="#4B5563">20%</text>
