<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Fonts Pre-load -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap');
      .heading { font-family: 'Outfit', 'Georgia', serif; font-weight: 700; fill: #111827; }
      .body-text { font-family: 'Inter', sans-serif; font-weight: 400; fill: #4B5563; }
      .body-bold { font-family: 'Inter', sans-serif; font-weight: 600; fill: #111827; }
      .mono { font-family: 'Courier New', Courier, monospace; fill: #1E3A5F; }
      .grid-lines { stroke: rgba(30, 58, 95, 0.03); stroke-width: 1; }
      .grid-lines-accent { stroke: rgba(30, 58, 95, 0.05); stroke-width: 0.5; }
      .border-line { stroke: rgba(17, 24, 39, 0.1); stroke-width: 1; }
    </style>
    
    <!-- Blueprint Grid Pattern (32x32px) -->
    <pattern id="blueprint-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" class="grid-lines" />
    </pattern>
    <!-- Blueprint Grid Accent Pattern (16x16px) -->
    <pattern id="blueprint-grid-accent" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" class="grid-lines-accent" />
    </pattern>
  </defs>

  <!-- 1. BASE CANVAS BACKGROUND -->
  <rect width="1920" height="1080" fill="#F8F6F2" />
  
  <!-- 2. BLUEPRINT GRID OVERLAY -->
  <rect width="1920" height="1080" fill="url(#blueprint-grid)" />
  <rect width="1920" height="1080" fill="url(#blueprint-grid-accent)" />

  <!-- 3. TOP NAVIGATION HEADER BAR -->
  <g id="Header-Bar">
    <rect x="0" y="0" width="1920" height="72" fill="#FFFFFF" />
    <line x1="0" y1="72" x2="1920" y2="72" class="border-line" />
    
    <!-- Title / Branding -->
    <text x="24" y="40" class="heading" font-size="20" letter-spacing="-0.02em">DEMEURE AI // COMMAND</text>
    <text x="24" y="55" class="mono" font-size="9" letter-spacing="0.1em">Institutional Campus OS</text>
    
    <!-- Core State Indicator -->
    <g transform="translate(340, 24)">
      <rect x="0" y="0" width="200" height="24" fill="rgba(53, 94, 59, 0.05)" stroke="rgba(53, 94, 59, 0.2)" stroke-width="1" />
      <circle cx="16" cy="12" r="4" fill="#355E3B" />
      <text x="30" y="16" class="mono" font-size="10" fill="#355E3B" font-weight="bold">CORE STATE: OPERATIONAL</text>
    </g>
    
    <!-- Live Time -->
    <text x="1300" y="42" class="mono" font-size="11" fill="#4B5563">14:35:37 | Sat, Jun 13</text>
    
    <!-- Persona Selector Mockup -->
    <g id="Persona-Selector" transform="translate(1500, 18)">
      <rect x="0" y="0" width="230" height="36" fill="#F8F6F2" stroke="rgba(17, 24, 39, 0.15)" stroke-width="1" />
      <text x="12" y="22" class="mono" font-size="11" fill="#111827" font-weight="bold">PERSONA: ADMIN</text>
      <path d="M 205 15 L 210 20 L 215 15" fill="none" stroke="#4B5563" stroke-width="1.5" />
    </g>
    
    <!-- Storyboard Button -->
    <g id="Storyboard-Btn" transform="translate(1750, 18)">
      <rect x="0" y="0" width="146" height="36" fill="#FFFFFF" stroke="rgba(17, 24, 39, 0.15)" stroke-width="1" />
      <text x="24" y="22" class="mono" font-size="10" fill="#4B5563" letter-spacing="0.05em">← STORYBOARD</text>
    </g>
  </g>

  <!-- 4. SIDEBAR NAVIGATION -->
  <g id="Sidebar-Navigation">
    <rect x="0" y="72" width="256" height="1008" fill="#FFFFFF" />
    <line x1="256" y1="72" x2="256" y2="1080" class="border-line" />
    
    <text x="24" y="110" class="mono" font-size="10" fill="#4B5563" letter-spacing="0.1em">SYSTEM SUB-PROTOCOLS</text>
    
    
    <!-- Item 1: OVERVIEW TELEMETRY -->
    <g transform="translate(12, 130)">
      <rect x="0" y="0" width="232" height="42" fill="none" />
      <text x="16" y="26" class="mono" font-size="11" fill="#111827">OVERVIEW TELEMETRY</text>
    </g>
    <!-- Item 2: ROOM ALLOCATION -->
    <g transform="translate(12, 180)">
      <rect x="0" y="0" width="232" height="42" fill="none" />
      <text x="16" y="26" class="mono" font-size="11" fill="#111827">ROOM ALLOCATION</text>
    </g>
    <!-- Item 3: STUDENT SURVEY FORM -->
    <g transform="translate(12, 230)">
      <rect x="0" y="0" width="232" height="42" fill="none" />
      <text x="16" y="26" class="mono" font-size="11" fill="#111827">STUDENT SURVEY FORM</text>
    </g>
    <!-- Item 4: POWER GRID DIAGNOSTICS (Active) -->
    <g transform="translate(12, 280)">
      <rect x="0" y="0" width="232" height="42" fill="#1E3A5F" />
      <text x="16" y="26" class="mono" font-size="11" fill="#FFFFFF" font-weight="bold">POWER GRID DIAGNOSTICS</text>
      <path d="M 210 16 L 215 21 L 210 26" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
    </g>
    <!-- Item 5: SECURITY SOC GATE -->
    <g transform="translate(12, 330)">
      <rect x="0" y="0" width="232" height="42" fill="none" />
      <text x="16" y="26" class="mono" font-size="11" fill="#111827">SECURITY SOC GATE</text>
    </g>
    <!-- Item 6: NLP COMPLAINT DESK -->
    <g transform="translate(12, 380)">
      <rect x="0" y="0" width="232" height="42" fill="none" />
      <text x="16" y="26" class="mono" font-size="11" fill="#111827">NLP COMPLAINT DESK</text>
    </g>
    <!-- Item 7: MESS &amp; FOOD OPTIMIZER -->
    <g transform="translate(12, 430)">
      <rect x="0" y="0" width="232" height="42" fill="none" />
      <text x="16" y="26" class="mono" font-size="11" fill="#111827">MESS &amp; FOOD OPTIMIZER</text>
    </g>
    <!-- Item 8: WELFARE OPERATIONS -->
    <g transform="translate(12, 480)">
      <rect x="0" y="0" width="232" height="42" fill="none" />
      <text x="16" y="26" class="mono" font-size="11" fill="#111827">WELFARE OPERATIONS</text>
    </g>
    <!-- Item 9: AI HANDBOOK RAG -->
    <g transform="translate(12, 530)">
      <rect x="0" y="0" width="232" height="42" fill="none" />
      <text x="16" y="26" class="mono" font-size="11" fill="#111827">AI HANDBOOK RAG</text>
    </g>

    <!-- Sidebar Footer Telemetry -->
    <g transform="translate(24, 1000)" class="mono" font-size="9" fill="#4B5563">
      <text x="0" y="0">HOSTEL ID: DE-DELHI-09</text>
      <text x="0" y="15">STITCH_NODE: ACTIVE</text>
      <text x="0" y="30">VER: 1.0.4 // LTS</text>
    </g>
  </g>

  <!-- 5. MAIN CONTENT AREA -->
  <g id="Main-Content" transform="translate(288, 104)">
    
    <!-- Module Header -->
    <g id="Content-Header">
      <text x="0" y="0" class="mono" font-size="11" fill="#4B5563" letter-spacing="0.2em">MODULE // 02</text>
      <text x="0" y="32" class="heading" font-size="32" font-family="'Outfit', sans-serif">Smart Power &amp; Resource Monitor</text>
      <line x1="0" y1="50" x2="1600" y2="50" class="border-line" />
    </g>
    
    
    <!-- KPI cards -->
    <g transform="translate(0, 72)">
      <g transform="translate(0, 0)">
        <rect width="500" height="96" fill="#FFFFFF" stroke="rgba(17, 24, 39, 0.1)" />
        <text x="24" y="32" class="mono" font-size="10" fill="#4B5563">TOTAL POWER DRAW (LIVE)</text>
        <text x="24" y="72" class="heading" font-size="32">44.8 kW</text>
        <text x="476" y="72" class="mono" font-size="11" fill="#355E3B" font-weight="bold" text-anchor="end">-6.2% VS BASELINE</text>
      </g>
      
      <g transform="translate(548, 0)">
        <rect width="500" height="96" fill="#FFFFFF" stroke="rgba(17, 24, 39, 0.1)" />
        <text x="24" y="32" class="mono" font-size="10" fill="#4B5563">ISOLATION FOREST TELEMETRY</text>
        <text x="24" y="72" class="heading" font-size="32">1 Alert</text>
        <text x="476" y="72" class="mono" font-size="11" fill="#D32F2F" font-weight="bold" text-anchor="end">● ACTION REQ</text>
      </g>
      
      <g transform="translate(1100, 0)">
        <rect width="500" height="96" fill="#FFFFFF" stroke="rgba(17, 24, 39, 0.1)" />
        <text x="24" y="32" class="mono" font-size="10" fill="#4B5563">FAULT DIAGNOSIS SCORE</text>
        <text x="24" y="72" class="heading" font-size="32">98 / 100</text>
        <text x="476" y="72" class="mono" font-size="11" fill="#4B5563" text-anchor="end">OPTIMAL BASELINE</text>
      </g>
    </g>

    <!-- Diagnostics Grid -->
    <g transform="translate(0, 192)">
      
      <!-- Graph Card (Left Column) -->
      <g transform="translate(0, 0)">
        <rect width="1050" height="580" fill="#FFFFFF" stroke="rgba(17, 24, 39, 0.1)" />
        
        <g transform="translate(24, 24)">
          <text x="0" y="16" class="heading" font-size="18">Real-time Current Load vs Baseline</text>
          
          <!-- Zone Selector tab bar -->
          <g transform="translate(720, -6)">
            <rect width="280" height="32" fill="#F8F6F2" stroke="rgba(17, 24, 39, 0.1)" />
            
            <rect x="0" y="0" width="94" height="32" fill="#1E3A5F" />
            <text x="47" y="20" class="mono" font-size="10" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Block A</text>
            
            <text x="141" y="20" class="mono" font-size="10" fill="#4B5563" text-anchor="middle">Block B</text>
            <line x1="94" y1="0" x2="94" y2="32" stroke="rgba(17,24,39,0.1)" />
            
            <text x="235" y="20" class="mono" font-size="10" fill="#4B5563" text-anchor="middle">Mess Hall</text>
            <line x1="188" y1="0" x2="188" y2="32" stroke="rgba(17,24,39,0.1)" />
          </g>
          
          <line x1="0" y1="36" x2="1002" y2="36" class="border-line" />
          
          <!-- Chart Grid Elements -->
          <g transform="translate(24, 60)">
            <!-- Y-Axis labels -->
            <g class="mono" font-size="9" fill="#4B5563" text-anchor="end">
              <text x="30" y="20">250 kW</text>
              <text x="30" y="100">200 kW</text>
              <text x="30" y="180">150 kW</text>
              <text x="30" y="260">100 kW</text>
              <text x="30" y="340">50 kW</text>
              <text x="30" y="420">0 kW</text>
            </g>
            
            <!-- Grid Lines -->
            <path d="M 50 20 L 960 20 M 50 100 L 960 100 M 50 180 L 960 180 M 50 260 L 960 260 M 50 340 L 960 340 M 50 420 L 960 420" stroke="rgba(17,24,39,0.03)" stroke-width="1" />
            
            <!-- Expected Baseline Path (Dashed Line) -->
            <path d="M 80 340 L 200 300 L 320 280 L 440 220 L 560 260 L 680 290 L 800 210 L 920 170 M 920 170" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 5" />
            
            <!-- Actual Consumption Path (Solid Navy Line) -->
            <path d="M 80 345 L 200 280 L 320 295 L 440 100 L 560 305 L 680 310 L 800 190 L 920 145 M 920 145" fill="none" stroke="#1E3A5F" stroke-width="2.5" />
            
            <!-- Spike callout dot -->
            <circle cx="440" cy="100" r="5" fill="#D32F2F" />
            <circle cx="440" cy="100" r="10" fill="none" stroke="#D32F2F" stroke-width="1.5" stroke-dasharray="2 2" />
            
            <!-- Spike callout dialog box -->
            <rect x="450" y="70" width="160" height="42" fill="#111827" />
            <text x="460" y="86" class="mono" font-size="9" fill="#FFFFFF">SPIKE: +1.8 kW</text>
            <text x="460" y="102" class="mono" font-size="9" fill="#FFFFFF">CONFIDENCE: 94.6%</text>
            
            <!-- X-Axis Labels -->
            <g class="mono" font-size="9" fill="#4B5563" text-anchor="middle" transform="translate(0, 445)">
              <text x="80" y="0">08:00</text>
              <text x="200" y="0">10:00</text>
              <text x="320" y="0">12:00 (SPIKE)</text>
              <text x="440" y="0">14:00</text>
              <text x="560" y="0">16:00</text>
              <text x="680" y="0">18:00</text>
              <text x="800" y="0">20:00</text>
              <text x="920" y="0">22:00</text>
            </g>
          </g>
          
          <text x="0" y="530" class="mono" font-size="9" fill="#4B5563">METHODOLOGY: ISOLATION FOREST + EXPONENTIAL SMOOTHING FORECAST</text>
          <text x="1002" y="530" class="mono" font-size="9" fill="#4B5563" text-anchor="end">LAST RUN: 2 MINS AGO</text>
        </g>
      </g>
      
      <!-- Fault Anomalies Desk (Right Column) -->
      <g transform="translate(1082, 0)">
        <rect width="518" height="580" fill="#FFFFFF" stroke="rgba(17, 24, 39, 0.1)" />
        
        <g transform="translate(24, 24)">
          <text x="0" y="16" class="heading" font-size="18">ML Fault Detections</text>
          <line x1="0" y1="28" x2="470" y2="28" class="border-line" />
          
          <text x="0" y="48" class="mono" font-size="10" fill="#4B5563">Continuous signature scan against baseline.</text>
          
          <!-- Anomaly Log 1 -->
          <g transform="translate(0, 72)">
            <rect width="470" height="130" fill="rgba(211, 47, 47, 0.03)" stroke="rgba(211, 47, 47, 0.2)" />
            
            <rect x="12" y="12" width="90" height="18" fill="none" stroke="#D32F2F" stroke-width="1" />
            <text x="57" y="24" class="mono" font-size="8" fill="#D32F2F" font-weight="bold" text-anchor="middle">INVESTIGATING</text>
            <text x="458" y="24" class="mono" font-size="9" fill="#4B5563" text-anchor="end">12:14:05</text>
            
            <text x="12" y="52" class="heading" font-size="13" fill="#111827">RM-304, Block A</text>
            <text x="12" y="70" class="mono" font-size="10" fill="#4B5563">Heavy Inductive Load (Heater)</text>
            
            <text x="12" y="92" class="mono" font-size="9" fill="#111827">LOAD IMPACT: +1.8 kW</text>
            <text x="458" y="92" class="mono" font-size="9" fill="#111827" font-weight="bold" text-anchor="end">CONF: 94.6%</text>
            
            <rect x="12" y="102" width="446" height="20" fill="#111827" />
            <text x="235" y="115" class="mono" font-size="8" fill="#FFFFFF" font-weight="bold" text-anchor="middle">MARK RESOLVED</text>
          </g>

          <!-- Anomaly Log 2 -->
          <g transform="translate(0, 218)">
            <rect width="470" height="100" fill="#F8F6F2" stroke="rgba(17, 24, 39, 0.1)" />
            
            <rect x="12" y="12" width="70" height="18" fill="none" stroke="#355E3B" stroke-width="1" />
            <text x="47" y="24" class="mono" font-size="8" fill="#355E3B" font-weight="bold" text-anchor="middle">RESOLVED</text>
            <text x="458" y="24" class="mono" font-size="9" fill="#4B5563" text-anchor="end">09:44:12</text>
            
            <text x="12" y="52" class="heading" font-size="13" fill="#111827">Elevator Shaft 2</text>
            <text x="12" y="70" class="mono" font-size="10" fill="#4B5563">Motor Voltage Oscillation</text>
            
            <text x="12" y="90" class="mono" font-size="9" fill="#4B5563">LOAD IMPACT: +4.2 kW  |  CONF: 88.2%</text>
          </g>

          <!-- Anomaly Log 3 -->
          <g transform="translate(0, 334)">
            <rect width="470" height="100" fill="#F8F6F2" stroke="rgba(17, 24, 39, 0.1)" />
            
            <rect x="12" y="12" width="70" height="18" fill="none" stroke="#355E3B" stroke-width="1" />
            <text x="47" y="24" class="mono" font-size="8" fill="#355E3B" font-weight="bold" text-anchor="middle">RESOLVED</text>
            <text x="458" y="24" class="mono" font-size="9" fill="#4B5563" text-anchor="end">Yesterday</text>
            
            <text x="12" y="52" class="heading" font-size="13" fill="#111827">Kitchen Oven C</text>
            <text x="12" y="70" class="mono" font-size="10" fill="#4B5563">Thermocouple Failure</text>
            
            <text x="12" y="90" class="mono" font-size="9" fill="#4B5563">LOAD IMPACT: Leakage Current  |  CONF: 91.0%</text>
          </g>
          
          <rect x="0" y="490" width="470" height="42" fill="#F8F6F2" stroke="rgba(17, 24, 39, 0.15)" />
          <text x="235" y="26" class="mono" font-size="10" fill="#111827" font-weight="bold" text-anchor="middle">RESET BASELINES</text>
        </g>
      </g>
    </g>
    
  </g>
</svg>