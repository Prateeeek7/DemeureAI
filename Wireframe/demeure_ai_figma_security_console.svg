            <line x1="296" y1="0" x2="296" y2="420" stroke="rgba(30, 58, 95, 0.05)" stroke-width="1" stroke-dasharray="4 4" />
            
            <!-- Scan status graphics: scanning active state -->
            <!-- Silhouette or scanning frame -->
            <rect x="48" y="70" width="220" height="220" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.5" stroke-dasharray="3 3" />
            
            <!-- Moving scan laser line mock -->
