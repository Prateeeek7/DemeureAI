            <text x="158" y="196" class="mono" font-size="8" fill="#355E3B" font-weight="bold" text-anchor="middle">FACE VECTOR SCAN ACTIVE</text>
            
            <!-- Right side diagnostics checks -->
            <g transform="translate(300, 70)">
              <text x="16" y="20" class="mono" font-size="11" fill="#111827">1. Blink Detection:</text>
              <text x="240" y="20" class="mono" font-size="11" fill="#355E3B" font-weight="bold" text-anchor="end">PASS</text>
              <line x1="16" y1="28" x2="240" y2="28" stroke="rgba(17,24,39,0.05)" />
              
              <text x="16" y="60" class="mono" font-size="11" fill="#111827">2. Head Pose Yaw:</text>
              <text x="240" y="60" class="mono" font-size="11" fill="#355E3B" font-weight="bold" text-anchor="end">PASS</text>
              <line x1="16" y1="68" x2="240" y2="68" stroke="rgba(17,24,39,0.05)" />
              
              <text x="16" y="100" class="mono" font-size="11" fill="#111827">3. Micro-Expression:</text>
              <text x="240" y="100" class="mono animate-pulse" font-size="11" fill="#4B5563" font-weight="bold" text-anchor="end">EVALUATING...</text>
              <line x1="16" y1="108" x2="240" y2="108" stroke="rgba(17,24,39,0.05)" />
            </g>

            <!-- Diagnostics footer -->
            <line x1="0" y1="380" x2="592" y2="380" stroke="rgba(17, 24, 39, 0.1)" />
            <text x="16" y="402" class="mono" font-size="9" fill="#4B5563">SCANNER NODE: SOC-G1</text>
            <text x="576" y="402" class="mono" font-size="9" fill="#4B5563" text-anchor="end">STATE: SCANNING</text>
          </g>
          
          <!-- Trigger control buttons -->
          <g transform="translate(0, 496)">
            <!-- Verify Resident button -->
            <rect x="0" y="0" width="280" height="42" fill="#1E3A5F" />
            <text x="140" y="26" class="mono" font-size="11" fill="#FFFFFF" font-weight="bold" text-anchor="middle">VERIFY RESIDENT (PASS)</text>
            
            <!-- Spoof photo fail button -->
            <rect x="312" y="0" width="280" height="42" fill="#F8F6F2" stroke="rgba(17, 24, 39, 0.15)" />
            <text x="452" y="26" class="mono" font-size="11" fill="#111827" font-weight="bold" text-anchor="middle">SPOOF PHOTO (FAIL)</text>
          </g>
        </g>
      </g>
      
      <!-- Right Column: Ledger -->
      <g transform="translate(672, 0)">
        <rect width="928" height="700" fill="#FFFFFF" stroke="rgba(17, 24, 39, 0.1)" />
        
        <g transform="translate(24, 24)">
          <text x="0" y="16" class="heading" font-size="18">Cryptographic Gate Ledger</text>
          <text x="880" y="16" class="mono" font-size="10" fill="#355E3B" font-weight="bold" text-anchor="end">● LIVE SYNC ACTIVE</text>
          <line x1="0" y1="28" x2="880" y2="28" class="border-line" />
          
          <text x="0" y="48" class="mono" font-size="10" fill="#4B5563">Every gate swipe records a cryptographic audit hash on the local chain.</text>
          
          <!-- Table -->
          <g transform="translate(0, 72)">
            <!-- Headers -->
            <text x="0" y="0" class="mono" font-size="10" fill="#4B5563" font-weight="bold">TIME</text>
            <text x="100" y="0" class="mono" font-size="10" fill="#4B5563" font-weight="bold">SUBJECT</text>
            <text x="280" y="0" class="mono" font-size="10" fill="#4B5563" font-weight="bold">TYPE</text>
            <text x="400" y="0" class="mono" font-size="10" fill="#4B5563" font-weight="bold">ROOM / PURPOSE</text>
            <text x="620" y="0" class="mono" font-size="10" fill="#4B5563" font-weight="bold">STATUS</text>
            <text x="740" y="0" class="mono" font-size="10" fill="#4B5563" font-weight="bold">AUDIT HASH</text>
            <line x1="0" y1="12" x2="880" y2="12" stroke="#111827" stroke-width="1" />
            
            <!-- Row 1 -->
            <g transform="translate(0, 32)">
              <text x="0" y="0" class="mono" font-size="11" fill="#111827">12:25:02</text>
              <text x="100" y="0" class="mono" font-size="11" fill="#111827" font-weight="bold">Pratik Kumar</text>
              <text x="280" y="0" class="mono" font-size="11" fill="#4B5563">Resident</text>
              <text x="400" y="0" class="mono" font-size="11" fill="#4B5563">RM-302</text>
              
              <rect x="620" y="-12" width="70" height="18" fill="rgba(53, 94, 59, 0.05)" stroke="rgba(53, 94, 59, 0.2)" />
              <text x="655" y="1" class="mono" font-size="8" fill="#355E3B" font-weight="bold" text-anchor="middle">GRANTED</text>
              
              <text x="740" y="0" class="mono" font-size="10" fill="#4B5563">e3b0c44298fc...</text>
              <line x1="0" y1="12" x2="880" y2="12" stroke="rgba(17,24,39,0.05)" />
            </g>
            
            <!-- Row 2 -->
            <g transform="translate(0, 68)">
              <text x="0" y="0" class="mono" font-size="11" fill="#111827">12:18:44</text>
              <text x="100" y="0" class="mono" font-size="11" fill="#111827" font-weight="bold">Rajesh Patel</text>
              <text x="280" y="0" class="mono" font-size="11" fill="#4B5563">Visitor</text>
              <text x="400" y="0" class="mono" font-size="11" fill="#4B5563">Parent Visit (Rm 104)</text>
              
              <rect x="620" y="-12" width="70" height="18" fill="rgba(53, 94, 59, 0.05)" stroke="rgba(53, 94, 59, 0.2)" />
              <text x="655" y="1" class="mono" font-size="8" fill="#355E3B" font-weight="bold" text-anchor="middle">GRANTED</text>
              
              <text x="740" y="0" class="mono" font-size="10" fill="#4B5563">8f7d9834279a...</text>
              <line x1="0" y1="12" x2="880" y2="12" stroke="rgba(17,24,39,0.05)" />
            </g>

            <!-- Row 3 -->
            <g transform="translate(0, 104)">
              <text x="0" y="0" class="mono" font-size="11" fill="#111827">11:59:10</text>
              <text x="100" y="0" class="mono" font-size="11" fill="#111827" font-weight="bold">Unknown Subject</text>
              <text x="280" y="0" class="mono" font-size="11" fill="#4B5563">Visitor</text>
              <text x="400" y="0" class="mono" font-size="11" fill="#D32F2F" font-weight="bold">Tailgating Attempt</text>
              
              <rect x="620" y="-12" width="70" height="18" fill="rgba(211, 47, 47, 0.05)" stroke="rgba(211, 47, 47, 0.2)" />
              <text x="655" y="1" class="mono" font-size="8" fill="#D32F2F" font-weight="bold" text-anchor="middle">DENIED</text>
              
              <text x="740" y="0" class="mono" font-size="10" fill="#D32F2F">7c8d9319de84...</text>
              <line x1="0" y1="12" x2="880" y2="12" stroke="rgba(17,24,39,0.05)" />
            </g>

            <!-- Row 4 -->
            <g transform="translate(0, 140)">
              <text x="0" y="0" class="mono" font-size="11" fill="#111827">11:15:32</text>
              <text x="100" y="0" class="mono" font-size="11" fill="#111827" font-weight="bold">Sunita Sharma</text>
              <text x="280" y="0" class="mono" font-size="11" fill="#4B5563">Staff</text>
              <text x="400" y="0" class="mono" font-size="11" fill="#4B5563">Housekeeping (Zone B)</text>
              
              <rect x="620" y="-12" width="70" height="18" fill="rgba(53, 94, 59, 0.05)" stroke="rgba(53, 94, 59, 0.2)" />
              <text x="655" y="1" class="mono" font-size="8" fill="#355E3B" font-weight="bold" text-anchor="middle">GRANTED</text>
              
              <text x="740" y="0" class="mono" font-size="10" fill="#4B5563">12a9bf843e9c...</text>
